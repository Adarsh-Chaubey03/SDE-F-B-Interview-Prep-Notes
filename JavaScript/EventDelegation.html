<!-- Event delegation means handling events of multiple child elements using a single event listener on their parent.
It improves performance, supports dynamically added child elements, and keeps the code cleaner.

Event delegation means you attach a single event listener to a common ancestor element (like a parent), rather than each child. 
When an event bubbles up from a child, the parent handles it, determining the target.

This saves memory, simplifies code, and works well for dynamic elements.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegation</title>
</head>

<body>

    <div class="box">
        <ul id="itemList">
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
            <li>Item 4</li>
        </ul>
    </div>

    <script>
        // Event delegation:
        // One event listener on the parent handles events
        // from multiple child elements.

        const itemList = document.querySelector("#itemList");

        itemList.addEventListener("click", (event) => {
            console.log(`Clicked on: ${event.target.textContent}`);
        });
    </script>

</body>
</html>
